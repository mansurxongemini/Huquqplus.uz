services:
  mariadb:
    image: mariadb
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./data/redis:/data
      - ./docker/redis.conf:/tmp/redis.conf
    command: [ 'redis-server', '/tmp/redis.conf', '--requirepass', '${REDIS_PASS}' ]

  app:
    command: python -m src.run_polling
    restart: always
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: aaliboyev/hqplus_bot:latest
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./data/user_data:/app/user_data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./reports:/app/reports
      - ./imtiyozlar_boshqaruvi:/app/imtiyozlar_boshqaruvi
    ports:
      - "127.0.0.1:8080:80"
    extra_hosts:
      - "api.telegram.org:149.154.167.99"

#  phpmyadmin:
#    image: phpmyadmin/phpmyadmin
#    depends_on:
#      - mariadb
#    ports:
#      - "8888:80"
#    environment:
#      - PMA_HOST=mariadb
#      - PMA_PORT=3306
#      - PMA_USER=${DB_USER}
#      - PMA_PASSWORD=${DB_PASSWORD}
#      - UPLOAD_LIMIT=1G
#      - PMA_ARBITRARY=1

  celery_worker:
    restart: always
    depends_on:
      - redis
      - mariadb
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: aaliboyev/hqplus_bot:latest
    command: ['sh', '/worker-start.sh']
    env_file:
      - .env
    extra_hosts:
      - "api.telegram.org:149.154.167.99"
    volumes:
      - ./data/user_data:/app/user_data
      - ./src:/app/src
      - ./imtiyozlar_boshqaruvi:/app/imtiyozlar_boshqaruvi
